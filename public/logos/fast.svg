<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="fast-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="60%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="fast-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="fast-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="60" cy="60" r="56" fill="url(#fast-indigo)" stroke="url(#fast-cyan)" stroke-width="2.5" filter="url(#fast-shadow)" />
  <circle cx="60" cy="60" r="48" fill="none" stroke="#818CF8" stroke-width="1.2" stroke-dasharray="3 2" />

  <!-- Inner Pure White Field -->
  <circle cx="60" cy="60" r="40" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5" />

  <!-- Graduation Mortarboard / Academic Cap -->
  <polygon points="60,37 78,44 60,51 42,44" fill="#312E81" />
  <polygon points="48,46.5 48,54 60,59 72,54 72,46.5 60,51" fill="#4338CA" />
  <!-- Tassel -->
  <line x1="72" y1="46" x2="76" y2="52" stroke="#06B6D4" stroke-width="1.8" />
  <circle cx="76" cy="53" r="1.5" fill="#06B6D4" />

  <!-- Modern Computing Nodes & Binary Circuit -->
  <g stroke="#06B6D4" stroke-width="1.5" fill="none">
    <circle cx="48" cy="67" r="2.5" fill="#06B6D4" />
    <circle cx="60" cy="71" r="2.5" fill="#4F46E5" />
    <circle cx="72" cy="67" r="2.5" fill="#06B6D4" />
    <path d="M48 67 L55 67 L60 71 L65 67 L72 67" />
  </g>

  <!-- Heraldic Banner -->
  <path d="M26 84 L36 78 L84 78 L94 84 L84 90 L36 90 Z" fill="url(#fast-cyan)" stroke="#1E40AF" stroke-width="1" />
  <text x="60" y="87" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="8" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">FAST-NU</text>

  <!-- Top Curved Label -->
  <path id="curve-fast" d="M 28 42 A 40 40 0 0 1 92 42" fill="none" />
  <text font-family="Arial, sans-serif" font-size="5.5" font-weight="bold" fill="#A5F3FC" letter-spacing="0.8">
    <textPath href="#curve-fast" startOffset="50%" text-anchor="middle">FOUNDATION UNIVERSITY</textPath>
  </text>
</svg>
