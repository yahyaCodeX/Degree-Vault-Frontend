<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="nust-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="60%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="nust-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="nust-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="60" cy="60" r="56" fill="url(#nust-green)" stroke="url(#nust-gold)" stroke-width="2.5" filter="url(#nust-shadow)" />
  <circle cx="60" cy="60" r="48" fill="none" stroke="#6EE7B7" stroke-width="1.2" stroke-dasharray="3 2" />

  <!-- Inner Pure White Circular Field -->
  <circle cx="60" cy="60" r="40" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" />

  <!-- Laurel Wreath -->
  <g fill="none" stroke="#059669" stroke-width="1.5">
    <path d="M38 52 C35 64 45 74 60 76 C75 74 85 64 82 52" />
  </g>

  <!-- Atomic Orbital Rings for Technology -->
  <ellipse cx="60" cy="52" rx="16" ry="6" fill="none" stroke="#10B981" stroke-width="1.2" transform="rotate(-30 60 52)" />
  <ellipse cx="60" cy="52" rx="16" ry="6" fill="none" stroke="#10B981" stroke-width="1.2" transform="rotate(30 60 52)" />
  <circle cx="60" cy="52" r="3" fill="#D97706" />

  <!-- Star & Crescent Emblem at Top -->
  <circle cx="60" cy="40" r="4.5" fill="#047857" />
  <circle cx="62" cy="39" r="3.5" fill="#FFFFFF" />
  <polygon points="63,39 64,41 66,41 64.5,42 65,44 63.5,43 62,44 62.5,42 61,41 63,41" fill="#D97706" />

  <!-- Heraldic Banner -->
  <path d="M26 84 L36 78 L84 78 L94 84 L84 90 L36 90 Z" fill="url(#nust-gold)" stroke="#78350F" stroke-width="1" />
  <text x="60" y="87" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="8" fill="#064E3B" text-anchor="middle" letter-spacing="1.5">NUST</text>

  <!-- Top Curved Label -->
  <path id="curve-nust" d="M 28 42 A 40 40 0 0 1 92 42" fill="none" />
  <text font-family="Arial, sans-serif" font-size="5.5" font-weight="bold" fill="#FCD34D" letter-spacing="0.8">
    <textPath href="#curve-nust" startOffset="50%" text-anchor="middle">DEFINING ALL HORIZONS</textPath>
  </text>
</svg>
