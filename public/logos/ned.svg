<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="ned-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="60%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#0C4A6E" />
    </linearGradient>
    <linearGradient id="ned-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="ned-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="60" cy="60" r="56" fill="url(#ned-blue)" stroke="#38BDF8" stroke-width="2.5" filter="url(#ned-shadow)" />
  <circle cx="60" cy="60" r="48" fill="none" stroke="#BAE6FD" stroke-width="1.2" stroke-dasharray="2 2" />

  <!-- Inner Pure White Circular Field -->
  <circle cx="60" cy="60" r="40" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" />

  <!-- Historic NED Edifice Architecture -->
  <g stroke="#0369A1" stroke-width="1.2" fill="none">
    <!-- Pediment Roof -->
    <polygon points="44,48 60,37 76,48" fill="#E0F2FE" />
    <!-- Pillars -->
    <line x1="48" y1="48" x2="48" y2="68" stroke-width="2" />
    <line x1="56" y1="48" x2="56" y2="68" stroke-width="2" />
    <line x1="64" y1="48" x2="64" y2="68" stroke-width="2" />
    <line x1="72" y1="48" x2="72" y2="68" stroke-width="2" />
    <!-- Base Platform -->
    <rect x="42" y="68" width="36" height="4" fill="#0284C7" stroke="none" />
  </g>

  <!-- Centenary Laurel Leaves flanking sides -->
  <path d="M33 55 Q30 65 37 75" fill="none" stroke="#0284C7" stroke-width="1.5" />
  <path d="M87 55 Q90 65 83 75" fill="none" stroke="#0284C7" stroke-width="1.5" />

  <!-- Heraldic Banner -->
  <path d="M26 84 L36 78 L84 78 L94 84 L84 90 L36 90 Z" fill="#0284C7" stroke="#38BDF8" stroke-width="1" />
  <text x="60" y="87" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="7.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.2">NED UET</text>

  <!-- Top Curved Label -->
  <path id="curve-ned" d="M 28 42 A 40 40 0 0 1 92 42" fill="none" />
  <text font-family="Arial, sans-serif" font-size="5.5" font-weight="bold" fill="#E0F2FE" letter-spacing="0.8">
    <textPath href="#curve-ned" startOffset="50%" text-anchor="middle">ESTD 1921 • KARACHI</textPath>
  </text>
</svg>
